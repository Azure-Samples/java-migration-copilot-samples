# Service accounts with workload identity annotation
# AZURE_CLIENT_ID is injected at deploy time by provision.ps1 via ConfigMap
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assets-manager-web-sa
  namespace: assets-manager
  annotations:
    azure.workload.identity/client-id: "ec2e3812-9b30-40da-9a3a-d246a6b2166e"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assets-manager-worker-sa
  namespace: assets-manager
  annotations:
    azure.workload.identity/client-id: "ec2e3812-9b30-40da-9a3a-d246a6b2166e"
